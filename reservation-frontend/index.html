<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h2>🍽️ Live Reservations</h2>

    <div class="form-section">
        <h3>Add New Reservation</h3>
        <form id="reservation-form">
            <input type="text" id="customerName" placeholder="Customer Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="datetime-local" id="reservationTime" required>
            <input type="number" id="numberOfGuests" placeholder="Guests" min="1" required>
            <button type="submit">Submit Reservation</button>
        </form>
    </div>

    <div class="form-section" id="login-section">
        <h3>Admin login</h3>
        <form id="login-form">
            <input type="text" id="adminUsername" placeholder="Username" required>
            <input type="password" id="adminPassword" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
        <p id="login-error" class="error"></p>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Customer Name</th>
            <th>Email</th>
            <th>Time</th>
            <th>Guests</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="reservations-table-body">
        <tr><td colspan="7" class="loading">Log in as admin to see the reservations.</td></tr>
        </tbody>
    </table>
    <div class="pagination">
        <button id="prevBtn">Previous</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextBtn">Next</button>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
